<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Canvas</title>
<style>/*LEAFLET_CSS*/.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; padding-right: 44px; } .acts button { border: 1px solid var(--line, #d5dde2); background: none; color: var(--ink-2); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12px; cursor: pointer; } .acts button:hover { color: var(--ink); } body.running .acts { display: none; }
@media (min-width: 700px) { body:not(.dash) .block.chart .plot { max-width: 560px; } }
@media (min-width: 900px) { body.dash #blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-items: start; } body { max-width: 760px; margin-left: auto; margin-right: auto; } body.dash { max-width: 1500px; } body.dash .block { margin: 0; } }
</style>
<style>
:root {
  --ink: #111827; --ink-2: #4B5563; --surface: #FFFFFF; --hairline: rgba(17, 24, 39, .08);
  --accent: #4F46E5; --good: #047857; --bad: #B91C1C; --warn: #B45309;
  --good-bg: rgba(4, 120, 87, .09); --bad-bg: rgba(185, 28, 28, .08); --warn-bg: rgba(180, 83, 9, .10); --note-bg: rgba(79, 70, 229, .08);
  --chart-ink: var(--ink); --chart-axis-text: var(--ink-2); --chart-grid: #E5E7EB; --chart-paper: var(--surface);
  --chart-1: #4F46E5; --chart-2: #0D9488; --chart-3: #D97706; --chart-4: #E11D48; --chart-5: #0284C7;
  --chart-muted: #C7CBD4; --chart-total: #6B7280; --chart-target: #B91C1C;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #F4F4F5; --ink-2: #A8A8B3; --surface: #1C1C1F; --hairline: rgba(255, 255, 255, .10);
    --accent: #818CF8; --good: #34D399; --bad: #F87171; --warn: #FBBF24;
    --good-bg: rgba(52, 211, 153, .12); --bad-bg: rgba(248, 113, 113, .12); --warn-bg: rgba(251, 191, 36, .12); --note-bg: rgba(129, 140, 248, .14);
    --chart-grid: #303036; --chart-1: #818CF8; --chart-2: #2DD4BF; --chart-3: #FBBF24; --chart-4: #FB7185; --chart-5: #38BDF8;
    --chart-muted: #4B4B55; --chart-total: #8B8B96; --chart-target: #F87171;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: transparent; }
body {
  margin: 0; padding: 8px 16px 28px; background: transparent; color: var(--ink);
  font-size: 17px; font: -apple-system-body; font-family: -apple-system, system-ui, "SF Pro Text", sans-serif;
  overflow-wrap: break-word;
}
h1, h2, h3, h4, p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

#head { padding: 4px 2px 14px; }
#question { font-size: 13px; font: -apple-system-footnote; color: var(--ink-2); }
#question::before { content: "“"; } #question::after { content: "”"; }
/* The app's two round buttons float at the top right, level with this line: the line keeps clear of them and is
   as tall as they are, so the title below always starts under the buttons. */
#question { padding-right: 118px; min-height: 46px; display: flex; align-items: center; }
#title { font-size: 30px; font: -apple-system-title1; font-size: 30px; font-weight: 750; letter-spacing: -.02em; line-height: 1.12; margin-top: 4px; text-wrap: balance; }
#head[hidden], #question:empty, #title:empty { display: none; }

.block { margin: 0 0 12px; }
.block.heading { margin: 22px 2px 10px; }
.block.heading h2 { font-size: 22px; font: -apple-system-title2; font-weight: 700; }
.block.heading h3 { font-size: 20px; font: -apple-system-title3; font-weight: 650; }

.block.kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.block.kpi.n1 { grid-template-columns: 1fr; }
.kpi-cell.wide { grid-column: 1 / -1; }
.kpi-cell { background: var(--surface); border-radius: 24px; padding: 14px 16px 12px; min-width: 0; box-shadow: 0 0 0 .5px var(--hairline); }
.kpi-label { font-size: 13px; font: -apple-system-footnote; color: var(--ink-2); }
.kpi-value { font-size: 28px; font: -apple-system-title1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 2px; }
.kpi-cell.wide .kpi-value { font-size: 34px; font: -apple-system-largetitle; font-weight: 750; }
.delta { font-size: 13px; font: -apple-system-footnote; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 3px; color: var(--ink-2); }
.delta.good { color: var(--good); } .delta.bad { color: var(--bad); }
.delta .arrow { font-size: .72em; margin-right: 3px; vertical-align: .08em; }
.delta .vs { font-weight: 400; color: var(--ink-2); }
.spark { margin-top: 8px; } .spark svg { display: block; width: 100%; height: auto; }
.kpi-cell { position: relative; }
.kpi-cell.wide.has-spark { padding-right: 150px; }
.kpi-cell.wide .spark { position: absolute; right: 16px; bottom: 16px; width: 118px; margin: 0; }

.block.insight { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border-radius: 26px; padding: 18px 18px 16px; box-shadow: 0 0 0 .5px var(--hairline); }
.block.insight .tile { flex: none; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--note-bg); color: var(--accent); }
.block.insight.good .tile { background: var(--good-bg); color: var(--good); }
.block.insight.bad .tile { background: var(--bad-bg); color: var(--bad); }
.block.insight.warn .tile { background: var(--warn-bg); color: var(--warn); }
.block.insight .body { min-width: 0; flex: 1; }
.block.insight h4 { font-size: 17px; font-weight: 600; font: -apple-system-headline; line-height: 1.25; margin-bottom: 4px; text-wrap: pretty; }
.block.insight p { font-size: 15px; font: -apple-system-subheadline; line-height: 1.4; color: var(--ink-2); }
.block.insight p strong { color: var(--ink); font-weight: 600; }
.block.insight p.basis { font-size: 12px; font: -apple-system-caption1; margin-top: 6px; opacity: .85; }

.block.chart, .block.table { background: var(--surface); border-radius: 26px; padding: 18px 16px 14px; box-shadow: 0 0 0 .5px var(--hairline); }
.block.chart h3, .block.table h3 { font-size: 12px; font: -apple-system-caption1; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.block.chart h3 .unit { font-weight: 400; letter-spacing: 0; text-transform: none; }
.block.chart h3 .unit::before { content: "· "; }
.takeaway { font-size: 17px; font-weight: 600; font: -apple-system-headline; line-height: 1.28; margin: 5px 0 12px; text-wrap: pretty; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; font-family: inherit; }
.plot svg text { font-variant-numeric: tabular-nums; }
.plot.up-neutral { --chart-up: var(--chart-1); --chart-down: var(--chart-3); }
.plot.up-good { --chart-up: var(--good); --chart-down: var(--bad); }
.plot.up-bad { --chart-up: var(--bad); --chart-down: var(--good); }
.source { font-size: 11px; font: -apple-system-caption2; color: var(--ink-2); margin-top: 10px; }
.through { font-size: 11px; font: -apple-system-caption2; color: var(--ink-2); margin-top: 2px; }
.through.stale { display: inline-block; margin-top: 8px; padding: 5px 10px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 12px; font: -apple-system-caption1; font-weight: 600; }
.through.stale span { font-weight: 800; margin-right: 3px; }
.block { position: relative; }
.flag { position: absolute; right: 6px; bottom: 4px; width: 44px; height: 44px; border: 0; background: none; color: var(--ink-2); opacity: .55; display: grid; place-items: center; padding: 0; }
.flag:active { opacity: 1; color: var(--bad); }
.block.heading .flag, body.running .flag, .block.kpi .flag { display: none; }
.block.chart, .block.table, .block.insight { padding-bottom: 30px; }

.map { height: 320px; border-radius: 16px; overflow: hidden; background: var(--chart-grid); z-index: 0; }
.map .leaflet-control-attribution { font-size: 9px; background: rgba(255, 255, 255, .7); }
.map .leaflet-popup-content { margin: 10px 12px; font: -apple-system-footnote; font-size: 13px; color: #111827; }
.map .leaflet-popup-content b { display: block; font-size: 15px; }
@media (prefers-color-scheme: dark) { .map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); } }
.map { position: relative; }
.map-hint { position: absolute; z-index: 500; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 5px 11px; border-radius: 12px; background: rgba(17, 24, 39, .72); color: #fff; font-size: 12px; font: -apple-system-caption1; pointer-events: none; white-space: nowrap; }
.map-top { list-style: none; margin: 10px 0 0; padding: 0; font-size: 15px; font: -apple-system-subheadline; }
.map-top li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
.map-top li:last-child { border-bottom: 0; }
.map-top b { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 8px; font-size: 12px; font: -apple-system-caption1; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
#tip { position: absolute; z-index: 20; max-width: 260px; padding: 7px 10px; border-radius: 10px; background: var(--ink); color: var(--surface); font-size: 13px; font: -apple-system-footnote; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .12s; }
#tip.on { opacity: 1; }
.plot svg [data-hit] { cursor: pointer; }
.block.table table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px; font: -apple-system-subheadline; }
.block.table th { font-size: 12px; font: -apple-system-caption1; font-weight: 600; color: var(--ink-2); text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--hairline); }
.block.table td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
.block.table tr:last-child td { border-bottom: 0; }
.block.table .n { text-align: right; padding-right: 0; padding-left: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }

#pulse { display: none; background: var(--surface); border-radius: 26px; padding: 16px; box-shadow: 0 0 0 .5px var(--hairline); }
body.running #pulse { display: block; }
#pulse i { display: block; height: 11px; border-radius: 6px; background: var(--hairline); margin-bottom: 10px; }
#pulse i:nth-child(1) { width: 38%; } #pulse i:nth-child(2) { width: 84%; height: 15px; } #pulse i:nth-child(3) { height: 96px; border-radius: 12px; margin-bottom: 0; }

#error, #transport { display: none; border-radius: 20px; padding: 13px 16px; background: var(--bad-bg); border-left: 3px solid var(--bad); font-size: 16px; font: -apple-system-callout; margin-bottom: 12px; }
#error:not(:empty), #transport:not(:empty) { display: block; }
#transport { background: var(--warn-bg); border-color: var(--warn); }

#next { display: none; margin-top: 18px; }
#next:not(:empty) { display: block; }
#next button {
  display: block; width: 100%; text-align: left; font-size: 16px; font: -apple-system-callout; color: var(--accent); font-weight: 600;
  background: var(--surface); border: 0; border-radius: 20px; padding: 15px 40px 15px 18px; margin-bottom: 8px; min-height: 44px; box-shadow: 0 0 0 .5px var(--hairline);
  position: relative;
}
#next button::after { content: "\2192"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-weight: 400; opacity: .7; }
#next button:active { opacity: .6; }

/* ---- arrange mode, cross-filter, print (the web app's dashboards) ---- */
@media (min-width: 900px) { body.dash .block.w2 { grid-column: span 2; } body.dash .block.wfull { grid-column: 1 / -1; } }
.arr { display: none; position: absolute; right: 10px; top: 8px; z-index: 5; gap: 4px; background: var(--surface); border-radius: 999px; padding: 3px; box-shadow: 0 0 0 1px var(--hairline), 0 4px 14px rgba(0,0,0,.16); }
.arr button { border: 0; background: none; color: var(--ink); font: inherit; font-size: 13px; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.arr button:hover { background: var(--note-bg); }
body.arrange .arr { display: flex; }
body.arrange .block { outline: 2px dashed var(--hairline); outline-offset: 2px; cursor: grab; border-radius: 26px; }
body.arrange .block.over { outline-color: var(--accent); }
body.arrange .block.drag { opacity: .45; }
body.arrange .acts, body.arrange .flag { display: none; }
.block[data-cross] .plot svg :is(rect, circle, path):has(> title) { cursor: pointer; }
@media print {
  :root { --ink: #111827; --ink-2: #4B5563; --surface: #FFFFFF; --hairline: rgba(17, 24, 39, .14); --accent: #4F46E5; --good: #047857; --bad: #B91C1C; --warn: #B45309;
    --chart-grid: #E5E7EB; --chart-1: #4F46E5; --chart-2: #0D9488; --chart-3: #D97706; --chart-4: #E11D48; --chart-5: #0284C7; --chart-muted: #C7CBD4; --chart-total: #6B7280; --chart-target: #B91C1C; color-scheme: light; }
  @page { size: A4 landscape; margin: 10mm; }
  html, body { background: #fff !important; } body { max-width: none !important; padding: 0; font-size: 13px; }
  .acts, .flag, .arr, #next, #tip, #pulse { display: none !important; }
  .block { break-inside: avoid; box-shadow: 0 0 0 1px var(--hairline) !important; }
  body.dash #blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  body.dash .block.w2, body.dash .block.wfull, body.dash .block.kpi { grid-column: 1 / -1; }
  #question { min-height: 0; padding-right: 0; } #title { font-size: 22px; }
  #filterline { display: block !important; font-size: 11px; color: var(--ink-2); margin: 2px 2px 8px; }
  .block.enter, .block.enter .plot svg { animation: none !important; }
}
#filterline { display: none; }

@media (prefers-reduced-motion: no-preference) {
  html:not([data-demo]) .block.enter { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
  html:not([data-demo]) .block.enter .plot svg { animation: wipe .9s .12s cubic-bezier(.3, .7, .2, 1) both; }
  html:not([data-demo]) body.running #pulse i { animation: breathe 1.4s ease-in-out infinite alternate; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); opacity: .2; } to { clip-path: inset(0 -4% 0 0); opacity: 1; } }
  @keyframes breathe { from { opacity: .45; } to { opacity: 1; } }
}
</style>
</head>
<body>
<header id="head" hidden><p id="question"></p><h1 id="title"></h1><p id="filterline"></p></header>
<main id="blocks" aria-live="polite"></main>
<div id="pulse" aria-hidden="true"><i></i><i></i><i></i></div>
<p id="error" role="alert"></p>
<p id="transport" role="status"></p>
<nav id="next" aria-label="Follow-up questions"></nav>
<div id="tip" role="status"></div>
<script>/*LEAFLET_JS*/</script>
<script>
"use strict";
const canvas = (() => {
  const $ = id => document.getElementById(id);
  let current = null, last = 0, shown = {}, layout = { order: [], width: {} };
  const post = m => { const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.canvas; if (h) h.postMessage(m); else if (window.parent !== window) window.parent.postMessage({ canvas: m }, location.origin); };
  const demo = () => document.documentElement.hasAttribute('data-demo');
  const nearEnd = () => window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 160;

  function clear() {
    current = null; last = 0; shown = {};
    $('blocks').replaceChildren(); $('next').replaceChildren();
    $('question').textContent = ''; $('title').textContent = ''; $('error').textContent = ''; $('transport').textContent = '';
    $('head').hidden = true; document.body.classList.remove('running');
    window.scrollTo(0, 0);
  }

  function render(report) {
    if (typeof report === 'string') report = JSON.parse(report);
    if (report.id !== current) { clear(); current = report.id; }
    $('transport').textContent = '';
    $('question').textContent = report.question || ''; $('title').textContent = report.title || '';
    $('head').hidden = !(report.question || report.title);
    const follow = nearEnd();
    let added = null;
    const web = window.parent !== window && !(window.webkit && window.webkit.messageHandlers);     // the web app: actions on the block
    const want = new Set((report.blocks || []).map(b => String(b.seq)));
    for (const old of [...$('blocks').children]) if (!want.has(old.dataset.seq)) { old.remove(); delete shown[old.dataset.seq]; }
    for (const b of report.blocks || []) {
      const had = $('blocks').querySelector('[data-seq="' + b.seq + '"]');
      if (had && shown[b.seq] === b.html) { had.dataset.cross = b.cross || ''; if (!b.cross) delete had.dataset.cross; continue; }
      const t = document.createElement('template'); t.innerHTML = b.html;
      const el = t.content.firstElementChild; el.dataset.seq = b.seq; if (b.cross) el.dataset.cross = b.cross;
      if (!had) el.classList.add('enter');
      const name = (el.querySelector('h3, h4') || {}).textContent || b.kind;
      const flag = document.createElement('button'); flag.type = 'button'; flag.className = 'flag';
      flag.setAttribute('aria-label', 'This is wrong: ' + name);
      flag.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4m0 1h11l-2 4 2 4H5"/></svg>';
      flag.addEventListener('click', () => post({ type: 'ask', text: 'This is wrong: "' + name.trim() + '". Check where this data comes from and how fresh it is, look for a better source, and report the problem to the owner of the data.' }));
      el.appendChild(flag);
      if (web) {
        const bar = document.createElement('div'); bar.className = 'acts';
        const act = (label, type) => { const x = document.createElement('button'); x.type = 'button'; x.textContent = label;
          x.addEventListener('click', ev => { ev.stopPropagation(); post({ type, seq: b.seq, title: name.trim(), chart: b.chart }); }); bar.appendChild(x); };
        if (b.chart) act('Other chart', 'alt');
        act('Ask about this', 'about'); act('Remove', 'remove');
        el.appendChild(bar);
        arrangeTools(el);
      }
      if (had) had.replaceWith(el); else { $('blocks').appendChild(el); added = added || el; }
      shown[b.seq] = b.html; last = Math.max(last, b.seq);
      el.querySelectorAll('.map[data-map]').forEach(drawMap);
    }
    layout = { order: (report.layout || {}).order || [], width: (report.layout || {}).width || {} };
    place();
    const active = ((report.filters || {}).defs || []).map(d => {
      const v = report.filters.values || {};
      if (d.kind === 'choice') return v[d.param] ? d.name + ': ' + v[d.param] : '';
      return v[d.param + '_from'] || v[d.param + '_to'] ? d.name + ': ' + (v[d.param + '_from'] || 'start') + ' to ' + (v[d.param + '_to'] || 'now') : '';
    }).filter(Boolean);
    $('filterline').textContent = active.length ? 'Filtered by ' + active.join('; ') : '';
    document.body.classList.toggle('running', report.status === 'running');
    document.body.classList.toggle('dash', report.mode === 'dashboard');
    $('error').textContent = report.status === 'failed' ? (report.error === 'cancelled' ? 'Stopped.' : 'This report did not finish: ' + (report.error || 'unknown error')) : '';
    const next = $('next'); next.replaceChildren();
    if (report.status === 'ok' && (report.suggestions || []).length) {
      for (const s of report.suggestions) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
        b.addEventListener('click', () => post({ type: 'ask', text: s })); next.appendChild(b);
      }
    }
    if (added && follow && !demo() && last > 1) added.scrollIntoView({ behavior: 'smooth', block: 'start' });
    post({ type: 'rendered', id: current, seq: last, status: report.status });
  }

  // ---- the arrangement of the tiles: order and width, changed in arrange mode and kept by the app ----
  const tiles = () => [...$('blocks').children];
  const ordered = () => tiles().sort((a, b) => Number(a.style.order || 0) - Number(b.style.order || 0));
  function place() {
    const rank = new Map(layout.order.map((s, i) => [String(s), i]));
    tiles().forEach((el, i) => {
      el.style.order = rank.has(el.dataset.seq) ? rank.get(el.dataset.seq) : layout.order.length + i;
      const w = layout.width[el.dataset.seq];
      el.classList.toggle('w2', w === 2); el.classList.toggle('wfull', w === 'full');
      const size = el.querySelector('.arr [data-size]'); if (size) size.textContent = w === 2 ? 'Wide' : w === 'full' ? 'Full row' : 'Normal';
    });
  }
  function keep(order) { layout.order = order.map(el => Number(el.dataset.seq)); place(); post({ type: 'layout', order: layout.order, width: layout.width }); }
  function arrangeTools(el) {
    const bar = document.createElement('div'); bar.className = 'arr';
    const add = (label, title, run, attr) => { const x = document.createElement('button'); x.type = 'button'; x.textContent = label; x.title = title; x.setAttribute('aria-label', title); if (attr) x.setAttribute(attr, '');
      x.addEventListener('click', ev => { ev.stopPropagation(); run(); }); bar.appendChild(x); };
    const move = step => { const list = ordered(), i = list.indexOf(el), j = i + step; if (j < 0 || j >= list.length) return; list.splice(i, 1); list.splice(j, 0, el); keep(list); };
    add('←', 'Move earlier', () => move(-1)); add('→', 'Move later', () => move(1));
    add('Normal', 'Change the width of this tile', () => { const w = layout.width[el.dataset.seq]; const next = w === 2 ? 'full' : w === 'full' ? 1 : 2;
      if (next === 1) delete layout.width[el.dataset.seq]; else layout.width[el.dataset.seq] = next; keep(ordered()); }, 'data-size');
    el.appendChild(bar);
    el.addEventListener('dragstart', ev => { if (!document.body.classList.contains('arrange')) { ev.preventDefault(); return; } dragged = el; el.classList.add('drag'); ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', el.dataset.seq); });
    el.addEventListener('dragend', () => { el.classList.remove('drag'); tiles().forEach(t => t.classList.remove('over')); dragged = null; });
    el.addEventListener('dragover', ev => { if (dragged && dragged !== el) { ev.preventDefault(); el.classList.add('over'); } });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', ev => { if (!dragged || dragged === el) return; ev.preventDefault(); const list = ordered().filter(t => t !== dragged); list.splice(list.indexOf(el), 0, dragged); keep(list); });
  }
  let dragged = null;
  function arrange(on) { document.body.classList.toggle('arrange', !!on); tiles().forEach(el => { el.draggable = !!on; }); $('tip').classList.remove('on'); }

  // ---- export to PowerPoint: one slide per block, charts as pictures in the light theme, tables as real tables ----
  const LIGHT = { '--ink': '#111827', '--ink-2': '#4B5563', '--surface': '#FFFFFF', '--chart-ink': '#111827', '--chart-axis-text': '#4B5563', '--chart-grid': '#E5E7EB', '--chart-paper': '#FFFFFF',
    '--chart-1': '#4F46E5', '--chart-2': '#0D9488', '--chart-3': '#D97706', '--chart-4': '#E11D48', '--chart-5': '#0284C7', '--chart-6': '#5C6B73', '--chart-muted': '#C7CBD4', '--chart-total': '#6B7280',
    '--chart-target': '#B91C1C', '--good': '#047857', '--bad': '#B91C1C', '--warn': '#B45309', '--accent': '#4F46E5' };
  function colour(value, plot) {
    const mode = plot && plot.classList.contains('up-good') ? ['--good', '--bad'] : plot && plot.classList.contains('up-bad') ? ['--bad', '--good'] : ['--chart-1', '--chart-3'];
    const own = { '--chart-up': LIGHT[mode[0]], '--chart-down': LIGHT[mode[1]] };
    let v = value, guard = 0;
    while (v.includes('var(') && guard++ < 6) v = v.replace(/var\((--[\w-]+)(?:,([^()]*))?\)/g, (_, n, fb) => own[n] || LIGHT[n] || (fb || '').trim() || '#000000');
    return v;
  }
  function picture(svg) {
    const copy = svg.cloneNode(true), plot = svg.closest('.plot'), box = svg.viewBox.baseVal, scale = 3;
    copy.querySelectorAll('title').forEach(t => t.remove());
    for (const node of [copy, ...copy.querySelectorAll('*')]) for (const a of [...node.attributes]) if (a.value.includes('var(')) node.setAttribute(a.name, colour(a.value, plot));
    copy.setAttribute('width', box.width * scale); copy.setAttribute('height', box.height * scale);
    copy.setAttribute('font-family', 'Arial, Helvetica, sans-serif'); copy.removeAttribute('class'); copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    return new Promise((done, fail) => {
      const img = new Image();
      img.onload = () => { const c = document.createElement('canvas'); c.width = box.width * scale; c.height = box.height * scale; const g = c.getContext('2d');
        g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0); done({ data: c.toDataURL('image/png'), ratio: box.width / box.height }); };
      img.onerror = () => fail(new Error('a chart could not be drawn as a picture'));
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(copy));
    });
  }
  function library() {
    if (window.PptxGenJS) return Promise.resolve();
    return new Promise((done, fail) => { const s = document.createElement('script'); s.src = '/vendor/pptxgen.bundle.js'; s.onload = done; s.onerror = () => fail(new Error('the PowerPoint library did not load')); document.head.appendChild(s); });
  }
  async function exportPptx(options) {
    await library();
    const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_WIDE';
    const W = 13.33, INK = '111827', GREY = '4B5563', face = 'Arial', text = el => el ? el.textContent.replace(/\s+/g, ' ').trim() : '';
    const title = text($('title')) || 'Report', line = text($('filterline'));
    const cover = pptx.addSlide();
    cover.addText(title, { x: 0.6, y: 2.3, w: W - 1.2, h: 1.6, fontSize: 34, bold: true, color: INK, fontFace: face, valign: 'top' });
    cover.addText([text($('question')), new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }), line].filter(Boolean).join('\n'),
      { x: 0.6, y: 4.0, w: W - 1.2, h: 1.6, fontSize: 14, color: GREY, fontFace: face, valign: 'top' });
    const head = (slide, small, big) => {
      if (small) slide.addText(small.toUpperCase(), { x: 0.5, y: 0.3, w: W - 1, h: 0.35, fontSize: 11, bold: true, color: GREY, fontFace: face, charSpacing: 1 });
      if (big) slide.addText(big, { x: 0.5, y: small ? 0.62 : 0.4, w: W - 1, h: 0.9, fontSize: 20, bold: true, color: INK, fontFace: face, valign: 'top' });
    };
    const foot = (slide, el) => { const t = [text(el.querySelector('.source')), text(el.querySelector('.through'))].filter(Boolean).join('  ·  ');
      if (t) slide.addText(t, { x: 0.5, y: 6.95, w: W - 1, h: 0.3, fontSize: 9, color: GREY, fontFace: face }); };
    for (const el of ordered()) {
      const slide = pptx.addSlide(), kind = ['kpi', 'insight', 'heading', 'table', 'chart'].find(k => el.classList.contains(k)) || 'other';
      if (kind === 'heading') { slide.addText(text(el.querySelector('h2, h3')), { x: 0.6, y: 2.8, w: W - 1.2, h: 1.4, fontSize: 30, bold: true, color: INK, fontFace: face }); continue; }
      if (kind === 'kpi') {
        head(slide, 'Key numbers', null);
        const cells = [...el.querySelectorAll('.kpi-cell')], cw = (W - 1 - 0.25 * (cells.length - 1)) / Math.max(1, cells.length);
        cells.forEach((c, i) => { const x = 0.5 + i * (cw + 0.25);
          slide.addShape(pptx.ShapeType.roundRect, { x, y: 2.2, w: cw, h: 2.4, fill: { color: 'F3F4F6' }, line: { color: 'E5E7EB', width: 0.75 }, rectRadius: 0.12 });
          slide.addText(text(c.querySelector('.kpi-label')), { x: x + 0.2, y: 2.35, w: cw - 0.4, h: 0.5, fontSize: 13, color: GREY, fontFace: face, valign: 'top' });
          slide.addText(text(c.querySelector('.kpi-value')), { x: x + 0.2, y: 2.9, w: cw - 0.4, h: 0.9, fontSize: cells.length > 3 ? 28 : 36, bold: true, color: INK, fontFace: face, fit: 'shrink' });
          const d = c.querySelector('.delta'); if (d) { const sr = d.querySelector('.sr'), arrow = d.querySelector('.arrow');
            const t = text(d).replace(text(sr), '').replace(text(arrow), '').trim(), up = /up/.test(text(sr));
            slide.addText((up ? '▲ ' : '▼ ') + t, { x: x + 0.2, y: 3.85, w: cw - 0.4, h: 0.45, fontSize: 12, color: d.classList.contains('good') ? '047857' : d.classList.contains('bad') ? 'B91C1C' : GREY, fontFace: face }); } });
        continue;
      }
      if (kind === 'insight') {
        head(slide, null, text(el.querySelector('h4')));
        const ps = [...el.querySelectorAll('.body p')].map(text).filter(Boolean);
        slide.addText(ps.join('\n\n'), { x: 0.5, y: 1.6, w: W - 1, h: 4.8, fontSize: 18, color: INK, fontFace: face, valign: 'top' });
        continue;
      }
      if (kind === 'table') {
        head(slide, text(el.querySelector('h3')), null);
        const cell = (c, bold) => ({ text: text(c), options: { bold, align: c.classList.contains('n') ? 'right' : 'left', color: INK, fontFace: face, fontSize: 12, fill: bold ? { color: 'F3F4F6' } : undefined } });
        const rows = [...el.querySelectorAll('tr')].map((r, i) => [...r.children].map(c => cell(c, i === 0)));
        if (rows.length) slide.addTable(rows, { x: 0.5, y: 1.0, w: W - 1, border: { type: 'solid', color: 'E5E7EB', pt: 0.75 }, autoPage: false });
        foot(slide, el); continue;
      }
      head(slide, text(el.querySelector('h3')), text(el.querySelector('.takeaway')));
      const svg = el.querySelector('.plot svg') || el.querySelector('svg.chart');
      if (svg) { const p = await picture(svg), maxW = W - 1, maxH = 5.2, w = Math.min(maxW, maxH * p.ratio), h = w / p.ratio;
        slide.addImage({ data: p.data, x: (W - w) / 2, y: 1.65 + (maxH - h) / 2, w, h }); }
      else slide.addText('This view is interactive (a map). Open the page in the app to see it.', { x: 0.5, y: 3, w: W - 1, h: 1, fontSize: 16, color: GREY, fontFace: face });
      foot(slide, el);
    }
    const name = (title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 60) || 'report') + '.pptx';
    if (options && options.base64) return pptx.write({ outputType: 'base64' });
    await pptx.writeFile({ fileName: name });
    return name;
  }

  // A map block: places as circles sized by their value, a route as a line, on street tiles. Pan, zoom, tap a place.
  function drawMap(node) {
    if (!window.L) { node.textContent = 'The map library is missing from this page.'; return; }
    const data = JSON.parse(node.dataset.map), css = getComputedStyle(document.documentElement);
    const accent = css.getPropertyValue('--chart-1').trim() || '#4F46E5', route = css.getPropertyValue('--chart-3').trim() || '#D97706';
    const map = L.map(node, { zoomControl: false, attributionControl: true, scrollWheelZoom: false, tap: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
    const bounds = [];
    if (data.path.length) { L.polyline(data.path, { color: route, weight: 3.5, opacity: .85 }).addTo(map); bounds.push(...data.path); }
    const top = Math.max(1, ...data.points.map(p => p.value || 0));
    data.points.forEach(p => {
      const r = p.value == null ? 7 : 6 + 16 * Math.sqrt(p.value / top);
      const mark = L.circleMarker(p.at, { radius: r, color: '#fff', weight: 1.5, fillColor: accent, fillOpacity: .78 }).addTo(map);
      const b = document.createElement('div'), name = document.createElement('b'); name.textContent = p.label; b.appendChild(name);
      if (p.text) b.appendChild(document.createTextNode(p.text + (data.valueLabel ? ' ' + data.valueLabel : '')));
      if (p.detail) { b.appendChild(document.createElement('br')); b.appendChild(document.createTextNode(p.detail)); }
      mark.bindPopup(b); bounds.push(p.at);
    });
    if (bounds.length === 1) map.setView(bounds[0], 14); else map.fitBounds(bounds, { padding: [26, 26], maxZoom: 16 });
    // On a phone one finger scrolls the page, so the map does not take the drag until it is tapped; a touch
    // outside the map gives the drag back to the page.
    if (L.Browser.touch) {
      const hint = document.createElement('div'); hint.className = 'map-hint'; hint.textContent = 'Tap the map to move it'; node.appendChild(hint);
      map.dragging.disable();
      map.on('click', () => { map.dragging.enable(); hint.remove(); });
      document.addEventListener('touchstart', e => { if (!node.contains(e.target)) map.dragging.disable(); }, { passive: true });
    }
    setTimeout(() => map.invalidateSize(), 60);
  }

  // Tap a mark of any chart to read its exact value (the mark's <title>).
  document.addEventListener('click', e => {
    const tip = $('tip'), mark = e.target.closest && e.target.closest('.plot svg *');
    const title = mark && mark.querySelector(':scope > title');
    if (!title) { tip.classList.remove('on'); return; }
    tip.textContent = title.textContent;
    const x = Math.min(window.innerWidth - tip.offsetWidth - 12, Math.max(12, e.pageX - tip.offsetWidth / 2));
    tip.style.left = x + 'px'; tip.style.top = (e.pageY - tip.offsetHeight - 14) + 'px'; tip.classList.add('on');
    const owner = mark.closest('.block');
    if (owner && !document.body.classList.contains('arrange')) post({ type: 'mark', seq: Number(owner.dataset.seq), cross: owner.dataset.cross || null, text: title.textContent, title: ((owner.querySelector('h3, h4') || {}).textContent || '').trim() });
  });
  window.addEventListener('scroll', () => $('tip').classList.remove('on'), { passive: true });

  function fail(text) { $('transport').textContent = text || ''; }

  window.addEventListener('load', () => post({ type: 'ready' }));
  return { render, clear, fail, arrange, exportPptx };
})();
</script>
<script>window.canvas = canvas;  // the web app reaches the page through its frame</script>
</body>
</html>
